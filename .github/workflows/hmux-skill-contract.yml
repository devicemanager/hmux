name: hmux skill contracts

on:
  pull_request:
    paths:
      - "skills/hmux-browser/**"
      - "skills/hmux-capture/**"
      - "skills/hmux-settings/**"
      - "web/data/hmux.schema.json"
      - "Sources/HmuxSettingsJSONPathSupport.swift"
      - "tests/test_hmux_settings_supported_paths.py"
      - ".agents/skills"
      - ".claude/skills/**"
      - "skills.sh"
      - "scripts/validate-hmux-browser-skill.py"
      - "tests/test_hmux_browser_skill.py"
      - "tests/test_hmux_capture_skill.py"
      - "CLI/HMUXCLI+Record.swift"
      - "CLI/HMUXCLI+Screenshot.swift"
      - "CLI/HMUXCLI+TaskHelp.swift"
      - "Sources/WindowRecordingSession.swift"
      - "Sources/TerminalController+WindowRecording.swift"
      - "Sources/TerminalController+WindowScreenshotMethod.swift"
      - "Packages/macOS/HmuxFoundation/Sources/HmuxFoundation/WindowCapture/WindowScreenshotRequest.swift"
      - "Packages/macOS/HmuxFoundation/Sources/HmuxFoundation/WindowRecording/WindowRecordingRequest.swift"
      - "tests/test_hmux_settings_jsonc.py"
      - "tests/test_hmux_settings_transactions.py"
      - ".github/workflows/hmux-skill-contract.yml"
  push:
    branches: [main]
    paths:
      - "skills/hmux-browser/**"
      - "skills/hmux-capture/**"
      - "skills/hmux-settings/**"
      - "web/data/hmux.schema.json"
      - "Sources/HmuxSettingsJSONPathSupport.swift"
      - "tests/test_hmux_settings_supported_paths.py"
      - ".agents/skills"
      - ".claude/skills/**"
      - "skills.sh"
      - "scripts/validate-hmux-browser-skill.py"
      - "tests/test_hmux_browser_skill.py"
      - "tests/test_hmux_capture_skill.py"
      - "CLI/HMUXCLI+Record.swift"
      - "CLI/HMUXCLI+Screenshot.swift"
      - "CLI/HMUXCLI+TaskHelp.swift"
      - "Sources/WindowRecordingSession.swift"
      - "Sources/TerminalController+WindowRecording.swift"
      - "Sources/TerminalController+WindowScreenshotMethod.swift"
      - "Packages/macOS/HmuxFoundation/Sources/HmuxFoundation/WindowCapture/WindowScreenshotRequest.swift"
      - "Packages/macOS/HmuxFoundation/Sources/HmuxFoundation/WindowRecording/WindowRecordingRequest.swift"
      - "tests/test_hmux_settings_jsonc.py"
      - "tests/test_hmux_settings_transactions.py"
      - ".github/workflows/hmux-skill-contract.yml"

permissions:
  contents: read

concurrency:
  group: hmux-skill-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-skill:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validate browser skill documentation contract
        run: python3 scripts/validate-hmux-browser-skill.py --no-cli

      - name: Exercise browser skill regression guard
        run: python3 tests/test_hmux_browser_skill.py

      - name: Exercise capture skill regression guard
        run: python3 tests/test_hmux_capture_skill.py

      - name: Exercise settings JSONC mutation regressions
        run: python3 tests/test_hmux_settings_jsonc.py

      - name: Exercise settings transaction regressions
        run: python3 tests/test_hmux_settings_transactions.py

      - name: Exercise settings skill path validation
        run: python3 tests/test_hmux_settings_supported_paths.py
