name: sdk preflight crates

on:
  workflow_call:
    inputs:
      version:
        description: "SDK version to validate"
        required: true
        type: string
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to validate, for example 0.1.0"
        required: true
        type: string

permissions: {}

env:
  RUST_TOOLCHAIN: "1.95.0"

concurrency:
  group: sdk-publish-crates-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag and package versions
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^hmux-sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "tag must match hmux-sdk-vX.Y.Z" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#hmux-sdk-v}"
            [[ "$DISPATCH_VERSION" == "$version" ]] || {
              echo "workflow_dispatch version $DISPATCH_VERSION does not match tag version $version" >&2
              exit 1
            }
          else
            version="$DISPATCH_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "workflow_dispatch version must match X.Y.Z" >&2
              exit 1
            }
          fi
          python3 hmux-tui/bindings/validate_release_version.py \
            --version "$version"
          python3 - "$version" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          root = pathlib.Path.cwd()
          versions = {
              "typescript package.json": json.loads((root / "hmux-tui/bindings/typescript/package.json").read_text())["version"],
              "python pyproject.toml": tomllib.loads((root / "hmux-tui/bindings/python/pyproject.toml").read_text())["project"]["version"],
              "rust Cargo.toml": tomllib.loads((root / "hmux-tui/bindings/rust/Cargo.toml").read_text())["package"]["version"],
              "rust-sidebar Cargo.toml": tomllib.loads((root / "hmux-tui/bindings/rust-sidebar/Cargo.toml").read_text())["package"]["version"],
          }
          mismatches = {name: got for name, got in versions.items() if got != expected}
          if mismatches:
              for name, got in mismatches.items():
                  print(f"{name}: expected {expected}, got {got}", file=sys.stderr)
              raise SystemExit(1)
          print(f"All package versions match {expected}")
          PY
          python3 hmux-tui/bindings/check-versions.py \
            --published-only \
            --expected "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bindings-e2e-rust:
    needs: version
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Init ghostty submodule
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install pinned Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          cargo --version
          rustc --version

      - name: Build hmux-tui server
        working-directory: hmux-tui
        run: cargo build -p hmux-tui --bin hmux-tui --locked

      - name: Test Rust SDK packages
        working-directory: hmux-tui
        env:
          HMUX_SDK_VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -euo pipefail
          cargo test -p hmux-sdk -p hmux-sidebar --locked
          cargo package -p hmux-sdk --locked
          cargo package \
            -p hmux-sidebar \
            --locked \
            --no-verify \
            --config \
              "patch.crates-io.hmux-sdk.path='$GITHUB_WORKSPACE/hmux-tui/bindings/rust'"

          verify_root="$RUNNER_TEMP/hmux-rust-package-verify"
          mkdir -p "$verify_root"
          tar -xzf \
            "target/package/hmux-sdk-$HMUX_SDK_VERSION.crate" \
            -C "$verify_root"
          tar -xzf \
            "target/package/hmux-sidebar-$HMUX_SDK_VERSION.crate" \
            -C "$verify_root"
          cargo test \
            --manifest-path \
              "$verify_root/hmux-sidebar-$HMUX_SDK_VERSION/Cargo.toml" \
            --config \
              "patch.crates-io.hmux-sdk.path='$verify_root/hmux-sdk-$HMUX_SDK_VERSION'" \
            --all-targets

      - name: Upload validated hmux-sdk crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hmux-rust-sdk-crate
          path: hmux-tui/target/package/hmux-sdk-${{ needs.version.outputs.version }}.crate
          if-no-files-found: error
          overwrite: true

      - name: Upload validated hmux-sidebar crate
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hmux-rust-sidebar-crate
          path: hmux-tui/target/package/hmux-sidebar-${{ needs.version.outputs.version }}.crate
          if-no-files-found: error
          overwrite: true

      - name: Rust SDK conformance
        run: |
          report="$RUNNER_TEMP/hmux-sdk-conformance-rust.txt"
          python3 hmux-tui/bindings/conformance/runner.py \
            --language rust \
            --require rust \
            --hmux-tui-bin "$GITHUB_WORKSPACE/hmux-tui/target/debug/hmux-tui" |
            tee "$report"
          grep -Eq '^PASS +rust +live-creation-exit-restart-unix$' "$report"
