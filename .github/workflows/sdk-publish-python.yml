name: sdk preflight python

on:
  workflow_call:
    inputs:
      version:
        description: "SDK version to validate"
        required: true
        type: string
    outputs:
      artifact_id:
        description: "Immutable ID of the validated Python distributions"
        value: ${{ jobs.build.outputs.artifact_id }}
      artifact_sha256:
        description: "SHA-256 of the validated distribution digest manifest"
        value: ${{ jobs.build.outputs.artifact_sha256 }}
  workflow_dispatch:
    inputs:
      version:
        description: "SDK version to validate, for example 0.1.0"
        required: true
        type: string

permissions: {}

env:
  RUST_TOOLCHAIN: "1.95.0"

concurrency:
  group: sdk-publish-python-${{ github.ref }}
  cancel-in-progress: false

jobs:
  version:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Validate tag and package versions
        id: version
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            [[ "$GITHUB_REF_NAME" =~ ^hmux-sdk-v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "tag must match hmux-sdk-vX.Y.Z" >&2
              exit 1
            }
            version="${GITHUB_REF_NAME#hmux-sdk-v}"
            [[ "$DISPATCH_VERSION" == "$version" ]] || {
              echo "workflow_dispatch version $DISPATCH_VERSION does not match tag version $version" >&2
              exit 1
            }
          else
            version="$DISPATCH_VERSION"
            [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
              echo "workflow_dispatch version must match X.Y.Z" >&2
              exit 1
            }
          fi
          python3 hmux-tui/bindings/validate_release_version.py \
            --version "$version"
          python3 - "$version" <<'PY'
          import json
          import pathlib
          import sys
          import tomllib

          expected = sys.argv[1]
          root = pathlib.Path.cwd()
          versions = {
              "typescript package.json": json.loads((root / "hmux-tui/bindings/typescript/package.json").read_text())["version"],
              "python pyproject.toml": tomllib.loads((root / "hmux-tui/bindings/python/pyproject.toml").read_text())["project"]["version"],
              "rust Cargo.toml": tomllib.loads((root / "hmux-tui/bindings/rust/Cargo.toml").read_text())["package"]["version"],
          }
          mismatches = {name: got for name, got in versions.items() if got != expected}
          if mismatches:
              for name, got in mismatches.items():
                  print(f"{name}: expected {expected}, got {got}", file=sys.stderr)
              raise SystemExit(1)
          print(f"All package versions match {expected}")
          PY
          python3 hmux-tui/bindings/check-versions.py \
            --published-only \
            --expected "$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  bindings-e2e-python:
    needs: version
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12.8"

      - name: Init ghostty submodule
        shell: bash
        run: bash scripts/ci/init-submodule.sh ghostty

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev pkg-config

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust toolchain
        run: |
          rustup toolchain install "$RUST_TOOLCHAIN" --profile minimal
          rustup default "$RUST_TOOLCHAIN"
          rustc --version

      - name: Build hmux-tui server
        working-directory: hmux-tui
        run: cargo build -p hmux-tui --bin hmux-tui --locked

      - name: Install declared Python build backend
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            "setuptools==80.9.0"

      - name: Test Python SDK package
        working-directory: hmux-tui/bindings/python
        run: PYTHONPATH=. python3 -m unittest discover -s tests -v

      - name: Python SDK conformance
        run: |
          report="$RUNNER_TEMP/hmux-sdk-conformance-python.txt"
          python3 hmux-tui/bindings/conformance/runner.py \
            --language python \
            --require python \
            --hmux-tui-bin "$GITHUB_WORKSPACE/hmux-tui/target/debug/hmux-tui" |
            tee "$report"
          grep -Eq '^PASS +python +live-creation-exit-restart-unix$' "$report"

  build:
    needs: bindings-e2e-python
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    permissions:
      contents: read
    outputs:
      artifact_id: ${{ steps.upload.outputs.artifact-id }}
      artifact_sha256: ${{ steps.package.outputs.artifact_sha256 }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6
        with:
          python-version: "3.12.8"

      - name: Install pinned Python packaging tools
        run: |
          python3 -m pip install \
            --disable-pip-version-check \
            "build==1.3.0" \
            "setuptools==80.9.0" \
            "wheel==0.45.1"

      - name: Build sdist and wheel
        working-directory: hmux-tui/bindings/python
        run: |
          set -euo pipefail
          SOURCE_DATE_EPOCH="$(git show -s --format=%ct "$GITHUB_SHA")"
          export SOURCE_DATE_EPOCH
          python3 -m build --no-isolation --sdist --wheel
          python3 ../normalize_python_sdist.py \
            --archive dist/*.tar.gz \
            --epoch "$SOURCE_DATE_EPOCH"

      - name: Test the exact Python distributions
        working-directory: hmux-tui/bindings/python
        env:
          HMUX_PYTHON_DIST_DIR: ${{ github.workspace }}/hmux-tui/bindings/python/dist
        run: PYTHONPATH=. python3 -m unittest tests.test_package_consumer -v

      - name: Fingerprint the validated Python distributions
        id: package
        run: |
          set -euo pipefail
          cd hmux-tui/bindings/python/dist
          shopt -s nullglob
          files=(*.whl *.tar.gz)
          [[ "${#files[@]}" == 2 ]] || {
            echo "expected one wheel and one source distribution" >&2
            exit 1
          }
          artifact_sha256="$(sha256sum "${files[@]}" | sort -k2 | sha256sum | cut -d ' ' -f 1)"
          [[ "$artifact_sha256" =~ ^[0-9a-f]{64}$ ]] || exit 1
          echo "artifact_sha256=$artifact_sha256" >> "$GITHUB_OUTPUT"

      - name: Upload distributions
        id: upload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: hmux-python-dist-${{ github.run_attempt }}
          path: hmux-tui/bindings/python/dist/*
          if-no-files-found: error
