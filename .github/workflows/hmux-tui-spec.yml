name: hmux-tui spec inventory

on:
  push:
    branches:
      - main
    paths:
      - "hmux-tui/**"
      - ".github/workflows/hmux-tui-spec.yml"
  pull_request:
    paths:
      - "hmux-tui/**"
      - ".github/workflows/hmux-tui-spec.yml"
  workflow_dispatch:

concurrency:
  group: hmux-tui-spec-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ${{ github.repository_owner != 'manaflow-ai' && 'ubuntu-24.04' || github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository && 'blacksmith-4vcpu-ubuntu-2404' || vars.LINUX_RUNNER || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Test inventory checker
        run: python3 hmux-tui/scripts/test_check_spec_inventory.py

      - name: Test frontend documentation protocol
        run: python3 hmux-tui/scripts/test_frontend_docs.py

      - name: Check protocol and TUI action inventory
        run: python3 hmux-tui/scripts/check-spec-inventory.py

      - name: Test deterministic SDK generator
        env:
          PYTHONPATH: hmux-tui/bindings
        run: python3 -m unittest discover -s hmux-tui/bindings/codegen/tests -v

      - name: Test SDK schema checker
        run: python3 hmux-tui/scripts/test_check_sdk_schema.py

      - name: Check SDK schema against runtime inventory
        run: python3 hmux-tui/scripts/check-sdk-schema.py

      - name: Test public resource boundary checker
        run: python3 hmux-tui/scripts/test_check_resource_api_boundary.py

      - name: Check public resource API boundary
        run: python3 hmux-tui/scripts/check-resource-api-boundary.py

      - name: Check generated SDK wire layers
        run: python3 hmux-tui/bindings/codegen/generate.py --check
