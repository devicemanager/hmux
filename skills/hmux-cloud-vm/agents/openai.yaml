interface:
  display_name: "hmux Cloud Machines"
  short_description: "Route work to hmux Cloud VMs from the CLI: vm route/run/agent pick a machine, vm tree/open show surfaces, plus exec, files, ports, checkpoints, and domains."
  default_prompt: "Use $hmux-cloud-vm to decide cloud vs local, let `hmux vm route`/`run`/`agent` pick or reuse a machine, run detached terminals, transfer files, inspect the tree, open surfaces, and publish VM ports; read `hmux vm <verb> --help` before using a new flag."
