[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "hmux-sdk"
version = "1.0.0"
description = "Typed Python resource client for hmux"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []
license = "MIT"

[project.urls]
Homepage = "https://github.com/manaflow-ai/cmux/tree/main/cmux-tui/bindings/python"
Repository = "https://github.com/manaflow-ai/cmux"

[tool.setuptools]
packages = ["hmux", "hmux.raw", "hmux.raw._generated"]

[tool.setuptools.package-data]
hmux = ["py.typed"]
